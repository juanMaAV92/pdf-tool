name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base: los PR apilados (contra otra rama de trabajo)
  # también pasan las comprobaciones.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --all-extras
      - name: Check formatting
        run: poetry run ruff format --check pdftool tests
      - name: Lint
        run: poetry run ruff check pdftool tests
      - name: Check types
        run: poetry run mypy
      - name: Run tests
        run: poetry run pytest -q --cov=pdftool --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Export runtime requirements
        run: |
          poetry self add poetry-plugin-export==1.10.1
          poetry export --without dev --all-extras -f requirements.txt -o requirements.txt
      - name: Audit dependencies
        # PYSEC-2026-4114 y CVE-2026-49272 (oauthlib): el arreglo está en 4.0,
        # pero flet 0.28.2 exige oauthlib<4. La app no usa las funciones OAuth
        # de flet. Revisar al actualizar flet.
        run: >-
          pipx run pip-audit==2.10.1 -r requirements.txt --require-hashes
          --disable-pip --ignore-vuln PYSEC-2026-4114
          --ignore-vuln CVE-2026-49272

  # Lo que recibe quien hace `pipx install pdf-tool`: el wheel sin extras, sin
  # Flet, con las dependencias más recientes que permite pyproject.
  cli-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Build wheel
        run: poetry build --format wheel
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/cli
          /tmp/cli/bin/pip install dist/*.whl
      - name: Flet must not be installed
        run: "! /tmp/cli/bin/python -c 'import flet'"
      - name: Run the CLI
        working-directory: /tmp
        run: |
          /tmp/cli/bin/pdf-tool list
          /tmp/cli/bin/python -c "import pymupdf; d = pymupdf.open(); d.new_page(); d.new_page(); d.save('a.pdf')"
          /tmp/cli/bin/pdf-tool split a.pdf --mode single --json > out.json
          /tmp/cli/bin/python -c "import json; assert json.load(open('out.json'))['ok']"
