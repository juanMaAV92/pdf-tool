name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install
      - name: Check formatting
        run: poetry run ruff format --check pdftool tests
      - name: Lint
        run: poetry run ruff check pdftool tests
      - name: Check core types
        run: poetry run mypy
      - name: Run tests
        run: poetry run pytest -q
